<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BreakerBook v36</title>

<style>
:root{color-scheme:light dark;--bg:#f5f5f3;--fg:#1d1d1f;--pn:#fff;--ln:#cfcfca;--ac:#2b6cb0}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f2f2f2;--pn:#2a2a2d;--ln:#48484c}}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:var(--pn);border-bottom:1px solid var(--ln)}
header b{margin-right:auto}
main{display:grid;grid-template-columns:1fr 340px;min-height:0}
#plan{display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--ln);align-items:center}
svg{flex:1;width:100%;min-height:300px;background:var(--pn);touch-action:none}
aside{overflow:auto;padding:10px;border-left:1px solid var(--ln);background:var(--pn);min-height:0}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 7px;margin:2px 0;max-width:100%}
input,select{width:100%}
button{cursor:pointer}
button.on{outline:2px solid var(--ac)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.65;margin:14px 0 4px}
.row{display:flex;gap:5px;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.it{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:4px;border-radius:6px;cursor:pointer}
.it:hover,.it.sel{background:var(--bg)}
.sm{font-size:12px;opacity:.7}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.danger{color:#c53030}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0;border-top:1px solid var(--ln)}body{height:auto}}
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block}
 @page{size:letter;margin:.5in}
 :root{--fg:#000;--pn:#fff;--bg:#fff;--ln:#999}
 .sheet{page-break-after:always;font:10pt system-ui,sans-serif;color:#000}
 .sheet:last-child{page-break-after:auto}
 .sheet h2{font-size:15pt;margin:0 0 2pt}
 .sheet .addr{font-size:16pt;font-weight:bold;margin:0 0 6pt}
 .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10pt}
 .qr{display:flex;flex-direction:column;align-items:flex-end;margin:0}
 .qr svg{width:.55in;height:.55in}
 .qr p{font-size:7pt;margin:2pt 0 0;text-align:right;word-break:break-all;max-width:2.2in}
 .sheet h3{font-size:11pt;opacity:1;text-transform:none;margin:8pt 0 3pt;color:#000}
 .plan{width:7.5in;height:auto;min-height:0;display:block}
 table{border-collapse:collapse;width:100%;font-size:9pt;margin:4px 0}
 td,th{border:1px solid #999;padding:2px 4px;text-align:left;vertical-align:top}
 .disc{font-size:8.5pt;margin-top:10px;border-top:1px solid #999;padding-top:4px}
}
#pdlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:5}
#pdlg.open{display:flex}
#pdlg .box{background:var(--pn);padding:16px;border-radius:8px;width:min(92vw,380px);display:grid;gap:6px;border:1px solid var(--ln)}
@media print{#pdlg{display:none!important}}
header{padding-top:calc(10px + env(safe-area-inset-top,0px))}
#bview{display:none;overflow:auto;padding:12px;flex:1;min-height:0}
body.bmode #bview{display:block}
body.bmode svg,body.bmode #tabs{display:none}
.pnl{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;margin:0 0 12px;display:inline-block;vertical-align:top;min-width:300px;max-width:100%}
.slot{display:flex;align-items:center;gap:8px;margin:4px 0}
.sn{width:24px;text-align:right;font-size:12px;opacity:.7}
.hl{flex:1;display:flex;gap:4px}
.h{flex:1;min-height:44px;border:2px solid var(--fg);border-radius:6px;padding:4px 8px;background:var(--pn);cursor:pointer;font-size:12px}
.h b{display:block;font-size:14px}
.h.empty{border:2px dashed var(--ln);opacity:.6}
.h.off{opacity:.5}
.bf{background:var(--pn);border:1px solid var(--ac);border-radius:8px;padding:10px;margin-bottom:12px;max-width:480px;display:grid;gap:6px}
#sdlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:6}
#sdlg.open{display:flex}
#sdlg .box{background:var(--pn);padding:16px;border-radius:8px;width:min(92vw,400px);display:grid;gap:6px;border:1px solid var(--ln)}
@media print{#sdlg{display:none!important}}
textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 7px;margin:2px 0;min-height:56px}
.pnl{display:block;width:100%;max-width:680px;min-width:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stk{flex:1;display:flex;flex-direction:column;gap:4px}
.tg{font-size:11px;padding:3px 5px;white-space:nowrap}
#ndlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:7}
#ndlg.open{display:flex}
#ndlg .box{background:var(--pn);padding:16px;border-radius:8px;width:min(92vw,360px);display:grid;gap:8px;border:1px solid var(--ln)}
@media print{#ndlg{display:none!important}}
#cdlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:8}
#cdlg.open{display:flex}
#cdlg .box{background:var(--pn);padding:16px;border-radius:8px;width:min(92vw,380px);display:grid;gap:10px;border:1px solid var(--ln)}
#cdlg h3{text-transform:none;font-size:15px;opacity:1}
@media print{#cdlg{display:none!important}}
.edit{border:2px solid var(--ac);border-radius:8px;padding:8px;margin:8px 0;background:var(--bg)}
#phdlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9}
#phdlg.open{display:flex}
#phdlg .box{background:var(--pn);padding:16px;border-radius:8px;width:min(92vw,460px);display:grid;gap:8px;border:1px solid var(--ln);max-height:90vh;overflow:auto}
@media print{#phdlg{display:none!important}}
#phdlg .box.wide{width:min(96vw,980px)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.pgl{max-height:62vh;overflow:auto;border:1px solid var(--ln);border-radius:6px}
.pgl img{width:100%;height:auto;display:block}
.pgr{max-height:62vh;overflow:auto;padding-right:4px}
@media(max-width:640px){.pg{grid-template-columns:1fr}.pgl{max-height:40vh}.pgr{max-height:none}}
</style></head><body>
<header><b>BreakerBook <span class="sm">v36</span></b>
<button data-act="open">Open file</button><button data-act="save">Save file</button><button data-act="printOpts">Print</button><button data-act="undo">Undo</button><button data-act="new">New</button>
<input type="file" id="fIn" accept=".json,application/json" hidden><span class="sm" id="stat"></span></header>
<main><div id="plan"><div id="tabs"></div><svg id="svg" viewBox="0 0 960 640"></svg><div id="bview"></div></div><aside id="side"></aside></main><div id="pdlg"><div class="box">
  <h3 style="margin:0">Print sheets</h3>
  <input id="pAddr" placeholder="Street address (optional)">
  <label class="sm"><input type="checkbox" id="pShow" style="width:auto"> Show address on printed pages</label>
  <input id="pShut" placeholder="Main shutoff location">
  <input id="pEv" placeholder="EV charger breaker and location">
  <div class="row"><button data-act="print">Print sheets</button><button data-act="closePrint">Close</button></div>
</div></div>
<div id="sdlg"><div class="box">
  <h3 style="margin:0">Set up your home</h3>
  <label class="sm">Basement?</label>
  <select id="sBase"><option value="0">No</option><option value="1">Yes</option></select>
  <label class="sm">Floors above the basement (first floor = 1)</label>
  <input id="sFl" type="number" min="1" max="5" value="2">
  <label class="sm">Garage</label>
  <select id="sGar"><option value="none">None</option><option value="att">Attached</option><option value="det">Detached</option></select>
  <label class="sm">Other powered buildings, separated by commas (e.g. Shed, Barn)</label>
  <input id="sOther" placeholder="Leave blank if none">
  <div class="row"><button data-act="setupGo">Set up</button><button data-act="setupSkip">Skip, I'll do it myself</button></div>
</div></div>
<div id="ndlg"><div class="box">
  <h3 style="margin:0">Lose any unsaved changes?</h3>
  <div class="row"><button class="danger" data-act="newYes">Yes</button><button data-act="newCancel">Cancel</button></div>
</div></div>
<div id="cdlg"><div class="box">
  <h3 id="cmsg" style="margin:0"></h3>
  <div class="row"><button class="danger" data-act="cYes">Yes</button><button data-act="cNo">Cancel</button></div>
</div></div>
<div id="phdlg"><div class="box" id="phbox"></div></div>
<input type="file" id="phFile" accept="image/*" hidden>
<input type="file" id="skFile" accept="image/*" hidden>
<div id="print"></div>
<script>
const DT=['Outlet','Switch','Light','Fan','Fixture','Other'];
const BT=['Standard','GFCI','AFCI','Double-pole'];
// Hues avoid red, which is reserved for unassigned items.
const PALETTE=[210,140,275,180,45,300,95,240,160,120,200,60];
const PX=14;          // one 1-foot grid square = 14 px on the plan
let VW=960,VH=640; // starting plan size (960 px = about 68.5 ft at 14 px per ft)  // plan size in px
const PW=100,PH=44;   // panel object size in px (small box)
const blank=()=>({version:3,updated:'',address:'',showAddress:true,mainShutoff:'',evCharger:'',setupDone:false,floors:[],panels:[],rooms:[],breakers:[],devices:[]});
let S=blank(),cur=0,sel=null,drag=null;
const $=id=>document.getElementById(id);
const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(v,hi));
const snap=v=>Math.round(v/PX)*PX;
const find=(k,id)=>({room:S.rooms,device:S.devices,breaker:S.breakers,panel:S.panels}[k]||[]).find(o=>o.id===id);
const bnum=b=>b.slot2?`${b.slot} & ${b.slot2}`:b.slot+(b.pole||'');
const colorOf=id=>{const i=S.breakers.findIndex(b=>b.id===id);return i<0?'#888':`hsl(${PALETTE[i%PALETTE.length]} 60% 42%)`};
const panelName=id=>(S.panels.find(p=>p.id===id)||{}).name||'';
const avail=p=>Array.from({length:p.total||0},(_,i)=>i+1).filter(n=>!S.breakers.some(b=>b.panel===p.id&&(b.slot===n||b.slot2===n)));
const setStat=t=>{$('stat').textContent=t};
let dirty=false,currentName='breakerbook';
const touch=()=>{S.updated=new Date().toLocaleString();dirty=true};

// Rooms: the Width field runs top to bottom, the Length field runs left to right.
const roomBox=r=>r.pts?{x:r.x,y:r.y,w:r.pw,h:r.ph}:{x:r.x,y:r.y,w:r.h*PX,h:r.w*PX};
const overlaps=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const roomsOn=(f,skip)=>S.rooms.filter(r=>r.floor===f&&r!==skip).map(roomBox);
function freeSpot(boxes,w,h){
  for(let y=0;y+h<=VH;y+=PX)for(let x=PX;x+w<=VW;x+=PX){const b={x,y,w,h};if(!boxes.some(o=>overlaps(b,o)))return{x,y}}
  return null;
}
function spotFor(boxes,w,h){let s=freeSpot(boxes,w,h);while(!s){VW+=280;VH+=280;s=freeSpot(boxes,w,h)}return s}
// The plan grows in 20-foot steps (280 px) when anything reaches its edge.
function growCanvas(){
  S.devices.forEach(d=>{if(d.room&&d.x!=null)clampDev(d)});
  let mx=0,my=0;
  S.rooms.forEach(r=>{const b=roomBox(r);mx=Math.max(mx,b.x+b.w);my=Math.max(my,b.y+b.h)});
  S.panels.forEach(p=>{mx=Math.max(mx,p.x+PW);my=Math.max(my,p.y+PH)});
  S.devices.forEach(d=>{if(d.x!=null){mx=Math.max(mx,d.x+60);my=Math.max(my,d.y+14)}});
  VW=960;VH=640;
  while(VW<mx+20)VW+=280;
  while(VH<my+20)VH+=280;
}
function clampRoom(r){const b=roomBox(r);r.x=clamp(snap(r.x),PX,VW-b.w);r.y=clamp(snap(r.y),0,VH-b.h)}
// A device stays inside its room's edges. Room-less devices stay on the plan.
function clampDev(d){
  const r=S.rooms.find(x=>x.id===d.room);
  if(r){const b=roomBox(r);d.x=clamp(Math.round(d.x),b.x+12,b.x+b.w-12);d.y=clamp(Math.round(d.y),b.y+12,b.y+b.h-12)}
  else{d.x=clamp(Math.round(d.x),8,VW-8);d.y=clamp(Math.round(d.y),8,VH-8)}
}
// Panels are small boxes that are not grid-snapped and not treated as rooms.
function clampPanel(p){p.x=clamp(Math.round(p.x),0,VW-PW);p.y=clamp(Math.round(p.y),0,VH-PH)}
function addRoom(name,w,h,floor){
  const r={id:uid('r'),floor,name,w:clamp(+w||10,1,200),h:clamp(+h||10,1,200),x:0,y:0};
  const b=roomBox(r),s=spotFor(roomsOn(floor),b.w,b.h);
  r.x=s.x;r.y=s.y;S.rooms.push(r);return r;
}
function placeDev(d){
  const r=S.rooms.find(x=>x.id===d.room);
  if(!r){d.x=null;d.y=null;return}
  const n=S.devices.filter(x=>x.room===r.id&&x.x!=null&&x.id!==d.id).length;
  d.floor=r.floor;d.x=r.x+30+(n%6)*24;d.y=r.y+60+Math.floor(n/6)*24;clampDev(d);
}
function delSel(){
  if(!sel)return;const {kind,id}=sel;
  if(kind==='room'){S.rooms=S.rooms.filter(r=>r.id!==id);S.devices.forEach(d=>{if(d.room===id){d.room='';d.x=null;d.y=null}})}
  else if(kind==='device'){S.devices=S.devices.filter(d=>d.id!==id);S.devices.forEach(d=>{if(d.ctrl===id)d.ctrl=''})}
  else if(kind==='breaker'){S.breakers=S.breakers.filter(b=>b.id!==id);S.devices.forEach(d=>{if(d.breaker===id)d.breaker=''})}
  else if(kind==='panel'){
    const gone=S.breakers.filter(b=>b.panel===id).map(b=>b.id);
    S.panels=S.panels.filter(p=>p.id!==id);
    S.breakers=S.breakers.filter(b=>b.panel!==id);
    S.devices.forEach(d=>{if(gone.includes(d.breaker))d.breaker=''});
    S.breakers.forEach(b=>{if(b.feedsPanel===id)b.feedsPanel=''});
  }
  sel=null;
}

// Standard US symbols, drawn centered on (0,0).
function symbol(t){
  const st='fill:none;stroke:var(--fg);stroke-width:1.5';
  if(t==='Outlet')return `<circle r="6" style="${st}"/><line x1="-3.5" y1="-1.6" x2="3.5" y2="-1.6" style="${st}"/><line x1="-3.5" y1="1.6" x2="3.5" y2="1.6" style="${st}"/>`;
  if(t==='Switch')return `<text y="4" font-size="11" font-weight="bold" text-anchor="middle" style="fill:var(--fg)">S</text>`;
  if(t==='Light'||t==='Fixture')return `<circle r="6" style="${st}"/><line x1="-4" y1="-4" x2="4" y2="4" style="${st}"/><line x1="-4" y1="4" x2="4" y2="-4" style="${st}"/>`;
  if(t==='Fan')return `<circle r="6" style="${st}"/><text y="3.5" font-size="9" text-anchor="middle" style="fill:var(--fg)">F</text>`;
  return `<rect x="-5" y="-5" width="10" height="10" style="${st}"/>`;
}

function drawPlan(){
  let h='';
  if(!S.floors.length){
    h='<text x="20" y="40" font-size="14" style="fill:var(--fg)">Add a floor to start, using the Floors section on the right.</text>';
  }else{
    for(const r of S.rooms.filter(r=>r.floor===cur)){
      const s=sel?.kind==='room'&&sel.id===r.id,b=roomBox(r);
      h+=`<g data-kind="room" data-id="${r.id}" style="cursor:move">${r.pts?`<polygon points="${r.pts.map(p=>(r.x+p.x)+','+(r.y+p.y)).join(' ')}" style="fill:none;stroke:${s?'var(--ac)':'var(--ln)'};stroke-width:${s?3:2}"/>`:`<rect x="${r.x}" y="${r.y}" width="${b.w}" height="${b.h}" rx="4" style="fill:none;stroke:${s?'var(--ac)':'var(--ln)'};stroke-width:${s?3:2}"/>`}${(()=>{let L=r.name;const mc=Math.max(1,Math.floor((b.w-14)/7));if(L.length>mc)L=L.slice(0,Math.max(1,mc-1))+'…';const tw=L.length*7+14,cx=r.x+b.w/2,cy=r.y+b.h*2/3;return `<rect x="${cx-tw/2}" y="${cy-13}" width="${tw}" height="19" rx="4" style="fill:var(--pn);stroke:var(--ln)"/><text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="13" style="fill:var(--fg)">${esc(L)}</text>`})()}</g>`;
    }
    for(const r of S.rooms.filter(r=>r.floor===cur&&r.pts&&sel?.kind==='room'&&sel.id===r.id))h+=r.pts.map((p,i)=>`<circle data-kind="vertex" data-id="${r.id}" data-vi="${i}" cx="${r.x+p.x}" cy="${r.y+p.y}" r="22" style="fill:transparent;cursor:move"/><circle data-kind="vertex" data-id="${r.id}" data-vi="${i}" cx="${r.x+p.x}" cy="${r.y+p.y}" r="9" style="fill:var(--ac);stroke:#fff;pointer-events:none"/>`).join('');
    // Dotted arcs: each device to the device it is controlled from (switch to first light, then light to light).
    for(const d of S.devices){
      const c=d.ctrl&&S.devices.find(x=>x.id===d.ctrl);
      if(!c||c.x==null||d.x==null||c.floor!==cur||d.floor!==cur)continue;
      const mx=(c.x+d.x)/2,my=(c.y+d.y)/2,dx=d.x-c.x,dy=d.y-c.y,len=Math.hypot(dx,dy)||1,off=len*0.25;
      h+=`<path d="M${c.x} ${c.y} Q${mx-dy/len*off} ${my+dx/len*off} ${d.x} ${d.y}" style="fill:none;stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 4"/>`;
    }
    for(const p of S.panels.filter(p=>p.floor===cur)){
      const s=sel?.kind==='panel'&&sel.id===p.id,n=S.breakers.filter(b=>b.panel===p.id).length;
      h+=`<g data-kind="panel" data-id="${p.id}" style="cursor:move"><rect x="${p.x}" y="${p.y}" width="${PW}" height="${PH}" rx="4" style="fill:var(--bg);stroke:${s?'var(--ac)':'var(--fg)'};stroke-width:2"/><text x="${p.x+6}" y="${p.y+16}" font-size="11" font-weight="bold" style="fill:var(--fg)">${esc(p.name)}</text><text x="${p.x+6}" y="${p.y+32}" font-size="9" style="fill:var(--fg)">${n} brk · ${avail(p).length} avail</text></g>`;
    }
    for(const d of S.devices){
      if(d.x==null||d.floor!==cur)continue;
      const s=sel?.kind==='device'&&sel.id===d.id;
      const b=S.breakers.find(x=>x.id===d.breaker);
      const ring=s?`<circle cx="${d.x}" cy="${d.y}" r="15" style="fill:none;stroke:var(--ac);stroke-width:2"/>`:'';
      const mark=b
        ?`<circle cx="${d.x}" cy="${d.y}" r="12" style="fill:${colorOf(b.id)}"/><text x="${d.x}" y="${d.y+3.5}" font-size="9" font-weight="bold" text-anchor="middle" style="fill:#fff">${esc(bnum(b))}</text>`
        :`<circle cx="${d.x}" cy="${d.y}" r="12" style="fill:#d33"/><text x="${d.x}" y="${d.y+5}" font-size="13" font-weight="bold" text-anchor="middle" style="fill:#fff">?</text>`;
      h+=`<g data-kind="device" data-id="${d.id}" style="cursor:move">${ring}${mark}<g transform="translate(${d.x+26},${d.y})">${symbol(d.type)}</g><text x="${d.x+38}" y="${d.y+4}" font-size="11" style="fill:var(--fg)">${esc(d.name)}${d.gfci?' · GFCI':''}</text></g>`;
    }
    if(!S.rooms.some(r=>r.floor===cur))h+='<text x="20" y="40" font-size="14" style="fill:var(--fg)">No rooms on this floor yet. Add one on the right.</text>';
  }
  if(drawing)h+=drawingSVG();
  $('svg').setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  $('svg').innerHTML=h;
}
function renderTabs(){
  $('tabs').innerHTML=S.floors.map((f,i)=>`<button class="${i===cur?'on':''}" data-act="tab" data-i="${i}">${esc(f)}</button>`).join('')
    +(S.floors.length?`<button data-act="fit">Fit rooms to view</button>`:'');
}
function editor(){
  if(!sel)return '<p class="sm">Tap a room, device, breaker, or panel to edit it. Drag rooms, devices, and panels on the plan to move them.</p>';
  const o=find(sel.kind,sel.id);if(!o){sel=null;return editor()}
  const f=(k,l,v,t='text')=>`<label class="sm">${l}</label><input data-f="${k}" type="${t}" value="${esc(v)}">`;

// Crop the drawing to the floor's content so symbols and text print at a readable size.
function floorBox(f){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(x,y,w,h)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+w);y1=Math.max(y1,y+h)};
  S.rooms.filter(r=>r.floor===f).forEach(r=>{const b=roomBox(r);add(b.x,b.y,b.w,b.h)});
  S.panels.filter(p=>p.floor===f).forEach(p=>add(p.x,p.y,PW,PH));
  S.devices.filter(d=>d.floor===f&&d.x!=null).forEach(d=>add(d.x-14,d.y-14,170,28));
  if(x0>=1e9)return [0,0,VW,VH];
  return [x0-20,y0-20,x1-x0+40,y1-y0+40];
}

  const ob=roomBox(o);
  for(const r of S.rooms.filter(r=>r.floor===o.floor&&r!==o&&overlaps(ob,roomBox(r)))){

// Sketch import (Floors mode): finds closed room outlines in a photo of a hand-drawn plan.
// OpenCV.js loads once, the first time this is used. Detection runs on this iPad.
let sk={mode:'pick',img:null,pts:[],k:0,cands:[]};
async function loadCV(){
  if(window.cvReady)return;
  await loadScript('https://docs.opencv.org/4.10.0/opencv.js');

}
function skStage(stage){
  sk.mode=stage;

  if(stage==='pick')box.innerHTML=`<h3 style="margin:0">Import rooms from a sketch</h3>
    <p class="sm">Photograph your hand-drawn plan straight down, in good light. Walls must form closed shapes. The photo stays on this iPad.</p>
    <div class="row"><button data-act="skChoose">Choose photo</button><button data-act="phCancel">Cancel</button></div>`;
  else if(stage==='scale')box.innerHTML=`<h3 style="margin:0">Set the scale</h3>
    <p class="sm">Tap both ends of a wall you have measured, then type its length in feet. Points tapped: ${sk.pts.length} of 2.</p>
    <canvas id="skc" style="width:100%;touch-action:none;border:1px solid var(--ln)"></canvas>
    <div class="row"><input id="skFt" type="number" placeholder="Length in feet"><button data-act="skDetect">Find rooms</button><button data-act="phCancel">Cancel</button></div>`;
  else box.innerHTML=`<h3 style="margin:0">Check the rooms found</h3>
    <p class="sm">Uncheck any outline that isn't a room, and name the rest. Sizes come from the scale.</p>
    <canvas id="skc" style="width:100%;border:1px solid var(--ln)"></canvas>
    ${sk.cands.map((c,i)=>`<div class="row"><input type="checkbox" data-ck="${i}" checked style="flex:0 0 28px"><span class="sn" style="flex:0 0 28px">${i+1}</span><input data-nm="${i}" placeholder="Room name" style="flex:2"><span class="sm" style="flex:1">${c.wf} × ${c.hf} ft</span></div>`).join('')||'<p class="sm">No rooms were found. Try a clearer, straighter photo.</p>'}
    <div class="row"><button data-act="skAdd">Add rooms</button><button data-act="phCancel">Cancel</button></div>`;
  drawSk();
}
function drawSk(){
  const c=$('skc');if(!c||!sk.img)return;
  c.width=sk.img.width;c.height=sk.img.height;
  const ctx=c.getContext('2d');
  ctx.drawImage(sk.img,0,0);
  const lw=Math.max(3,c.width/300);
  if(sk.mode==='scale'){
    ctx.fillStyle='#2b6cb0';ctx.strokeStyle='#2b6cb0';ctx.lineWidth=lw;
    sk.pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,lw*3,0,Math.PI*2);ctx.fill()});
    if(sk.pts.length===2){ctx.beginPath();ctx.moveTo(sk.pts[0].x,sk.pts[0].y);ctx.lineTo(sk.pts[1].x,sk.pts[1].y);ctx.stroke()}
  }
  if(sk.mode==='review'){
    ctx.strokeStyle='#2b6cb0';ctx.fillStyle='#2b6cb0';ctx.lineWidth=lw;ctx.font=`bold ${Math.round(c.width/35)}px sans-serif`;
    sk.cands.forEach((cd,i)=>{ctx.strokeRect(cd.x,cd.y,cd.w,cd.h);ctx.fillText(String(i+1),cd.x+lw*2,cd.y+c.width/25)});
  }
}
function skTap(e){
  if(sk.mode!=='scale')return;
  const c=$('skc'),r=c.getBoundingClientRect();
  if(sk.pts.length>=2)sk.pts=[];
  sk.pts.push({x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height});
  skStage('scale');
}
// Finds light areas enclosed by dark lines and keeps the ones that look like rectangles.
function detectRooms(canvas){
  const src=cv.imread(canvas),gray=new cv.Mat(),bin=new cv.Mat(),cnts=new cv.MatVector(),hier=new cv.Mat();
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  cv.adaptiveThreshold(gray,bin,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,31,10);
  cv.findContours(bin,cnts,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  const W=canvas.width,H=canvas.height,out=[];
  for(let i=0;i<cnts.size();i++){
    const c=cnts.get(i),r=cv.boundingRect(c),box=r.width*r.height,fill=cv.contourArea(c)/(box||1);
    if(box/(W*H)>0.01&&box/(W*H)<0.6&&r.width>20&&r.height>20){
      const ap=new cv.Mat();cv.approxPolyDP(c,ap,0.015*cv.arcLength(c,true),true);
      const poly=[];for(let j=0;j<ap.rows;j++)poly.push({x:ap.data32S[j*2],y:ap.data32S[j*2+1]});
      out.push({x:r.x,y:r.y,w:r.width,h:r.height,poly});ap.delete();
    }
    c.delete();
  }
  src.delete();gray.delete();bin.delete();cnts.delete();hier.delete();
  out.sort((a,b)=>b.w*b.h-a.w*a.h);
  return out.filter((r,i)=>!out.slice(0,i).some(o=>r.x>=o.x&&r.y>=o.y&&r.x+r.w<=o.x+o.w&&r.y+r.h<=o.y+o.h));
}
async function skDetect(){
  const ft=+$('skFt').value;
  if(sk.pts.length<2||!ft){setStat('Tap two points on a wall and enter its length.');return}
  const px=Math.hypot(sk.pts[0].x-sk.pts[1].x,sk.pts[0].y-sk.pts[1].y);
  sk.k=ft/px;
  try{
    await loadCV();
    const c=document.createElement('canvas');c.width=sk.img.width;c.height=sk.img.height;
    c.getContext('2d').drawImage(sk.img,0,0);
    sk.cands=detectRooms(c).map(r=>({...r,wf:clamp(Math.round(r.w*sk.k),1,200),hf:clamp(Math.round(r.h*sk.k),1,200)}));
    skStage('review');
  }catch(err){alert('The room finder could not load or read this photo. Check the internet connection and try a clearer photo.');skStage('scale')}
}
function skAdd(){
  const s=sk.k*PX;let added=0,skipped=0;
  sk.cands.forEach((c,i)=>{
    if(!document.querySelector(`[data-ck="${i}"]`)?.checked)return;
    const name=(document.querySelector(`[data-nm="${i}"]`)?.value||'').trim()||`Room ${i+1}`;
    const r={id:uid('r'),floor:cur,name,w:c.wf,h:c.hf,x:Math.round((40+c.x*s)/PX)*PX,y:Math.round((40+c.y*s)/PX)*PX};
    if(c.poly&&c.poly.length>=3){
      const ab=c.poly.map(p=>({x:40+p.x*s,y:40+p.y*s})),mx=Math.min(...ab.map(p=>p.x)),my=Math.min(...ab.map(p=>p.y));
      r.x=Math.floor(mx/PX)*PX;r.y=Math.floor(my/PX)*PX;
      r.pts=ab.map(p=>({x:Math.round(p.x-r.x),y:Math.round(p.y-r.y)}));
      r.pw=Math.max(...r.pts.map(p=>p.x));r.ph=Math.max(...r.pts.map(p=>p.y));
      r.w=Math.max(1,Math.round(r.ph/PX));r.h=Math.max(1,Math.round(r.pw/PX));
    }
    clampRoom(r);
    if(roomsClash(r,S.rooms.filter(x=>x.floor===cur))){skipped++;return}
    S.rooms.push(r);added++;
  });
  $('phdlg').classList.remove('open');
  setStat(`Added ${added} room${added===1?'':'s'}${skipped?`; skipped ${skipped} that overlap existing rooms`:''}.`);
}

// Irregular rooms: corner-by-corner drawing, corner editing, and exact outline checks for overlaps.
let drawing=null; // corners of an irregular room being drawn, or null
function shapePts(r){if(r.pts){const q=r.pts.map(p=>({x:r.x+p.x,y:r.y+p.y}));return q.filter((p,i)=>!(i>0&&p.x===q[i-1].x&&p.y===q[i-1].y)).filter((p,i,a)=>!(i===a.length-1&&a.length>1&&p.x===a[0].x&&p.y===a[0].y))}const b=roomBox(r);return[{x:b.x,y:b.y},{x:b.x+b.w,y:b.y},{x:b.x+b.w,y:b.y+b.h},{x:b.x,y:b.y+b.h}]}
function normalizePoly(r,abs){
  const mx=Math.min(...abs.map(p=>p.x)),my=Math.min(...abs.map(p=>p.y));
  r.x=Math.floor(mx/PX)*PX;r.y=Math.floor(my/PX)*PX;
  r.pts=abs.map(p=>({x:Math.round(p.x-r.x),y:Math.round(p.y-r.y)}));
  r.pw=Math.max(...r.pts.map(p=>p.x));r.ph=Math.max(...r.pts.map(p=>p.y));
  r.w=Math.max(1,Math.round(r.ph/PX));r.h=Math.max(1,Math.round(r.pw/PX));
}
function segsCross(a,b,c,d){const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);const d1=o(c,d,a),d2=o(c,d,b),d3=o(a,b,c),d4=o(a,b,d);return((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0))}
function inPoly(p,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if((P[i].y>p.y)!==(P[j].y>p.y)&&p.x<(P[j].x-P[i].x)*(p.y-P[i].y)/(P[j].y-P[i].y)+P[i].x)c=!c}return c}
const centerOf=P=>({x:P.reduce((s,p)=>s+p.x,0)/P.length,y:P.reduce((s,p)=>s+p.y,0)/P.length});
// A point lies on an outline edge (within half a pixel).
function onEdge(p,P){for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],len=Math.hypot(b.x-a.x,b.y-a.y);if(!len)continue;const cr=Math.abs((b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x))/len;if(cr<=0.5&&p.x>=Math.min(a.x,b.x)-0.5&&p.x<=Math.max(a.x,b.x)+0.5&&p.y>=Math.min(a.y,b.y)-0.5&&p.y<=Math.max(a.y,b.y)+0.5)return true}return false}
const strictlyInside=(p,P)=>!onEdge(p,P)&&inPoly(p,P);
// Points just inside each edge of a shape. Unlike the average of the corners, these always fall inside the shape.
function inwardSamples(P){let area=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];area+=a.x*b.y-b.x*a.y}const sg=area>0?1:-1,out=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],len=Math.hypot(b.x-a.x,b.y-a.y);if(!len)continue;const dx=b.x-a.x,dy=b.y-a.y,nx=sg*-dy/len,ny=sg*dx/len;out.push({x:(a.x+b.x)/2+nx*2,y:(a.y+b.y)/2+ny*2})}return out}
// Points spread along every edge, so overlaps with shared (collinear) edges are still found.
function edgeSamples(P){const out=[];for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];for(const t of [0.25,0.5,0.75])out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return out}
function polyOverlap(A,B){
  for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)if(segsCross(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;
  return edgeSamples(A).some(p=>strictlyInside(p,B))||edgeSamples(B).some(p=>strictlyInside(p,A))||inwardSamples(A).some(p=>strictlyInside(p,B))||inwardSamples(B).some(p=>strictlyInside(p,A));

function polySelf(P){const n=P.length;for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;if(segsCross(P[i],P[(i+1)%n],P[j],P[(j+1)%n]))return true}return false}

function applyShape(r,abs){
  const tmp={...r};normalizePoly(tmp,abs);
  if(polySelf(abs)){setStat('The corners would cross each other.');return false}
  if(roomsClash(tmp,S.rooms.filter(x=>x.floor===r.floor&&x.id!==r.id))){setStat('That shape would overlap another room.');return false}
  Object.assign(r,tmp);return true;
}
function drawingSVG(){
  if(!drawing||!drawing.length)return'';
  return `<polyline points="${drawing.map(p=>p.x+','+p.y).join(' ')}" style="fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:5 4"/>`+drawing.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" style="fill:var(--ac)"/>`).join('');
}
function finishDraw(){
  if(!drawing||drawing.length<3){setStat('Tap at least 3 corners.');return}
  if(polySelf(drawing)){setStat('The corners cross each other. Undo the last corner and try again.');return}
  const r={id:uid('r'),floor:cur,name:($('rName')?.value||'').trim()||'Room',w:1,h:1,x:0,y:0};
  normalizePoly(r,drawing);
  if(roomsClash(r,S.rooms.filter(x=>x.floor===cur))){setStat('That shape overlaps another room.');return}
  S.rooms.push(r);drawing=null;setStat(`Added ${r.name}.`);
}
function vAdd(id){
  const r=S.rooms.find(x=>x.id===id);if(!r)return;
  const A=shapePts(r),n=A.length;
  applyShape(r,[...A,{x:snap((A[n-1].x+A[0].x)/2),y:snap((A[n-1].y+A[0].y)/2)}]);
}
function vDel(id){
  const r=S.rooms.find(x=>x.id===id);if(!r)return;
  const A=shapePts(r);
  if(A.length<=3){setStat('A room needs at least 3 corners.');return}
  applyShape(r,A.slice(0,-1));
}

// Undo: every change to the data is recorded when the screen redraws (the saved timestamp is ignored).
let undoStack=[],lastSnap=null;
const snapKey=()=>{const {updated,...rest}=S;return JSON.stringify(rest)};
function newFile(){S=blank();VW=960;VH=640;undoStack=[];lastSnap=null;cur=0;sel=null;bform=null;dirty=false;currentName='breakerbook';setStat('New file. Save to keep it.');render()}

  const key=snapKey();
  if(lastSnap!==null&&key!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>50)undoStack.shift()}

document.addEventListener('click',e=>{
  if(e.target.id==='skc'){skTap(e);return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,k=t.dataset.kind;
  let changed=true;
  if(a==='sel')sel={kind:k,id};
  else if(a==='tab'){cur=+t.dataset.i;sel=null;changed=false}
  else if(a==='open')$('fIn').click();
  else if(a==='new'){if(dirty)$('ndlg').classList.add('open');else newFile();changed=false}
  else if(a==='newYes'){$('ndlg').classList.remove('open');newFile();changed=false}
  else if(a==='newCancel'){$('ndlg').classList.remove('open');changed=false}
  else if(a==='combine'){
    const p=S.panels.find(x=>x.id===t.dataset.panel),n=+t.dataset.slot;
    const top=S.breakers.find(b=>b.panel===p.id&&b.slot===n&&!b.pole&&!b.slot2);
    if(top)top.slot2=n+2;
    else bform={panel:p.id,slot:n,slot2:n+2,pole:'',id:null};
  }
  else if(a==='split'){const b=S.breakers.find(x=>x.id===id);if(b)delete b.slot2;bform=null}
  else if(a==='save'){
    const nm=prompt('Save file as',currentName);
    if(!nm){changed=false;render();return}
    currentName=nm.trim().replace(/[\/:*?"<>|]+/g,'-')||'breakerbook';
    touch();
    const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    const x=document.createElement('a');x.href=url;x.download=currentName+'.json';dirty=false;x.click();
    setStat('Saved '+currentName+'.json');changed=false;
  }
  else if(a==='printOpts'){
    $('pAddr').value=S.address;$('pShow').checked=S.showAddress;$('pShut').value=S.mainShutoff;$('pEv').value=S.evCharger;
    $('pdlg').classList.add('open');changed=false;
  }
  else if(a==='closePrint'){$('pdlg').classList.remove('open');changed=false}
  else if(a==='print'){$('pdlg').classList.remove('open');changed=false;buildPrint()}
  else if(a==='view'){document.body.classList.toggle('bmode',t.dataset.v==='brk');changed=false}
  else if(a==='bnew'){bform={panel:t.dataset.panel,slot:+t.dataset.slot,pole:t.dataset.pole,id:null};changed=false}
  else if(a==='bedit'){const b=S.breakers.find(x=>x.id===id);if(b)bform={panel:b.panel,slot:b.slot,pole:b.pole||'',id:b.id};changed=false}
  else if(a==='bfCancel'){bform=null;changed=false}
  else if(a==='bfSave'){
    const amps=$('bfAmps').value.trim().replace(/a$/i,'');
    const vals={label:$('bfLabel').value.trim(),amps,type:$('bfType').value,status:$('bfStatus').value,feedsPanel:$('bfFeeds').value};
    if(bform.id)Object.assign(S.breakers.find(x=>x.id===bform.id),vals);
    else S.breakers.push({id:uid('b'),panel:bform.panel,slot:bform.slot,slot2:bform.slot2,pole:bform.pole,...vals});
    bform=null;
  }
  else if(a==='bfDel'){
    const id0=bform.id,dv=S.devices.filter(d=>d.breaker===id0).length;
    const doit=()=>{S.breakers=S.breakers.filter(x=>x.id!==id0);S.devices.forEach(d=>{if(d.breaker===id0)d.breaker=''});bform=null;touch();render()};
    if(dv){askConfirm(`Delete this breaker? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} breaker assignment.`,doit);changed=false}
    else{doit();changed=false}
  }
  else if(a==='bpAdd'){
    const n=$('bpName').value.trim();
    if(!n){setStat('Enter a panel name.');changed=false}
    else{
      const cnt=S.panels.filter(q=>q.floor===cur).length;
      const p={id:uid('p'),name:n,location:$('bpLoc').value.trim(),total:+$('bpTot').value||0,floor:cur,x:VW-PW-20,y:20+cnt*(PH+12)};
      clampPanel(p);S.panels.push(p);
    }
  }
  else if(a==='setupOpen'){openWiz();changed=false}
  else if(a==='setupSkip'){
    if(W.step==='floors'){S.setupDone=true;$('sdlg').classList.remove('open');changed=false}
    else{
      // Keep whatever was typed on the current step and on earlier steps.
      if(W.step==='rooms'&&W.wantRooms==='1')W.rooms=S.floors.map((f,i)=>$('rt'+i)?.value||'');
      if(W.step==='panels'){W.panelText=$('wPanels').value;W.panels=parsePanels(W.panelText)}
      finishWiz();return;
    }
  }
  else if(a==='setupGo'){
    const names=[];
    if($('sBase').value==='1')names.push('Basement');
    const n=Math.min(5,Math.max(1,+$('sFl').value||1));
    ['First floor','Second floor','Third floor','Fourth floor','Fifth floor'].slice(0,n).forEach(x=>names.push(x));
    const g=$('sGar').value;
    if(g==='att')names.push('Garage');
    if(g==='det')names.push('Garage (detached)');
    $('sOther').value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>names.push(x));
    names.forEach(x=>{if(!S.floors.includes(x))S.floors.push(x)});
    cur=0;showWiz('rooms');return;
  }
  else if(a==='wizRooms'){
    if(W.wantRooms==='1')W.rooms=S.floors.map((f,i)=>$('rt'+i)?.value||'');
    showWiz('panels');return;
  }
  else if(a==='wizPanels'){
    W.panelText=$('wPanels').value;
    W.panels=parsePanels(W.panelText);
    if(!W.panels.length){finishWiz();return}
    showWiz('breakers');return;
  }
  else if(a==='wizBack'){showWiz({rooms:'floors',panels:'rooms',breakers:'panels'}[W.step]);return}
  else if(a==='wizFinish'){finishWiz();return}
  else if(a==='tandem'){
    const p=S.panels.find(x=>x.id===t.dataset.panel),n=+t.dataset.slot;
    p.tandem=p.tandem||{};
    if(p.tandem[n]){
      if(S.breakers.some(b=>b.panel===p.id&&b.slot===n&&b.pole==='B')){setStat('Remove the B breaker before making this slot single.');changed=false}
      else{p.tandem[n]=false;S.breakers.forEach(b=>{if(b.panel===p.id&&b.slot===n&&b.pole==='A')b.pole=''})}
    }else{
      p.tandem[n]=true;S.breakers.forEach(b=>{if(b.panel===p.id&&b.slot===n&&!b.pole)b.pole='A'});
    }
    bform=null;
  }
  else if(a==='drawStart'){drawing=[];setStat('Tap the corners on the plan, in order.');changed=false}
  else if(a==='drawUndo'){if(drawing)drawing.pop();changed=false}
  else if(a==='drawCancel'){drawing=null;changed=false}
  else if(a==='drawFinish'){finishDraw()}
  else if(a==='vAdd'){vAdd(id)}
  else if(a==='vDel'){vDel(id)}
  else if(a==='sketch'){sk={mode:'pick',img:null,pts:[],k:0,cands:[]};$('phdlg').classList.add('open');skStage('pick');changed=false}
  else if(a==='skChoose'){$('skFile').click();changed=false}
  else if(a==='skDetect'){skDetect();changed=false}
  else if(a==='skAdd'){skAdd()}
  else if(a==='photo'){openPhoto();changed=false}
  else if(a==='phChoose'){phCtx.panel=S.panels.find(x=>x.id===$('phPanel').value)||null;if(phCtx.panel)$('phFile').click();changed=false}
  else if(a==='phCancel'){$('phdlg').classList.remove('open');changed=false}
  else if(a==='phApply'){applyGuide()}
  else if(a==='phConfirm'){
    let upd=0;
    document.querySelectorAll('[data-cf]').forEach(sel=>{
      const c=phPending.conflicts[+sel.dataset.cf];
      if(sel.value==='update'){updateFromPhoto(c.ex,c.b);upd++}
    });
    finishPhoto(phPending.added,upd);
  }
  else if(a==='phAll'){
    phPending.conflicts.forEach(c=>updateFromPhoto(c.ex,c.b));
    finishPhoto(phPending.added,phPending.conflicts.length);
  }
  else if(a==='undo'){
    if(undoStack.length){S=JSON.parse(undoStack.pop());lastSnap=snapKey();sel=null;bform=null;setStat('Undone.')}
    else setStat('Nothing to undo.');
    changed=false;
  }
  else if(a==='mode'){mode=t.dataset.m;sel=null;changed=false}
  else if(a==='floorDel'){
    const i=+t.dataset.i,c=floorCounts(i);
    askConfirm(`Delete ${S.floors[i]} and everything on it: ${c.r} room${c.r===1?'':'s'}, ${c.d} item${c.d===1?'':'s'}, and ${c.p} panel${c.p===1?'':'s'}?`,()=>{
      const pIds=S.panels.filter(p=>p.floor===i).map(p=>p.id);
      const bIds=S.breakers.filter(b=>pIds.includes(b.panel)).map(b=>b.id);
      S.devices=S.devices.filter(d=>d.floor!==i);
      S.devices.forEach(d=>{if(bIds.includes(d.breaker))d.breaker=''});
      S.breakers=S.breakers.filter(b=>!bIds.includes(b.id));
      S.breakers.forEach(b=>{if(pIds.includes(b.feedsPanel))b.feedsPanel=''});
      S.panels=S.panels.filter(p=>p.floor!==i);
      S.rooms=S.rooms.filter(r=>r.floor!==i);
      const shift=f=>f>i?f-1:f;
      S.rooms.forEach(r=>{r.floor=shift(r.floor)});
      S.devices.forEach(d=>{d.floor=shift(d.floor)});
      S.panels.forEach(p=>{p.floor=shift(p.floor)});
      S.floors.splice(i,1);
      cur=clamp(cur>i?cur-1:cur===i?0:cur,0,Math.max(0,S.floors.length-1));
      sel=null;touch();render();
    });
    changed=false;
  }
  else if(a==='cYes'){const f=pendingYes;pendingYes=null;$('cdlg').classList.remove('open');if(f)f();changed=false}
  else if(a==='cNo'){pendingYes=null;$('cdlg').classList.remove('open');changed=false}
  else if(a==='del'){
    if(sel?.kind==='panel'){
      const nb=S.breakers.filter(b=>b.panel===sel.id),ids=nb.map(b=>b.id),dv=S.devices.filter(d=>ids.includes(d.breaker)).length;
      const pid=sel.id;
      askConfirm(`Delete this panel and its ${nb.length} breaker${nb.length===1?'':'s'}? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} breaker assignment.`,()=>{delSel();bform=null;touch();render()});
      changed=false;
    }else if(sel?.kind==='room'){
      const rid=sel.id,rn=(S.rooms.find(r=>r.id===rid)||{}).name||'this room';
      const dv=S.devices.filter(d=>d.room===rid).length;
      const doit=()=>{delSel();bform=null;touch();render()};
      askConfirm(dv
        ?`Delete ${rn}? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} room and move to Needs assignment.`
        :`Delete ${rn}?`,doit);
      changed=false;
    }else if(sel?.kind==='breaker'){
      const bid=sel.id,dv=S.devices.filter(d=>d.breaker===bid).length;
      const doit=()=>{delSel();bform=null;touch();render()};
      if(dv){askConfirm(`Delete this breaker? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} breaker assignment.`,doit);changed=false}
      else doit();
    }else delSel();
  }
  else if(a==='fit'){
    const placed=[];
    S.rooms.filter(r=>r.floor===cur).forEach(r=>{const b=roomBox(r),s=spotFor(placed,b.w,b.h);r.x=s.x;r.y=s.y;placed.push(roomBox(r))});
    S.devices.forEach(d=>{if(d.room&&d.x!=null)clampDev(d)});
  }
  else if(a==='addFloor'){const n=$('fName').value.trim();if(n){S.floors.push(n);cur=S.floors.length-1}else changed=false}
  else if(a==='addRoom'){
    if(!S.floors.length){setStat('Add a floor first.');changed=false}
    else{const r=addRoom($('rName').value.trim()||'Room',$('rW').value,$('rH').value,cur);sel={kind:'room',id:r.id}}
  }
  else if(a==='addDevice'){
    const type=$('dType').value;
    const d={id:uid('d'),name:$('dName').value.trim()||type,type,room:$('dRoom').value,breaker:$('dBrk').value,gfci:$('dGfci').checked,ctrl:'',floor:cur,x:null,y:null};
    S.devices.push(d);placeDev(d);sel={kind:'device',id:d.id};
  }
  else if(a==='addPanel'){
    const n=S.panels.filter(q=>q.floor===cur).length;
    const p={id:uid('p'),name:$('pName').value.trim()||'Panel',location:$('pLoc').value.trim(),total:+$('pTot').value||0,floor:cur,x:VW-PW-20,y:20+n*(PH+12)};
    clampPanel(p);S.panels.push(p);sel={kind:'panel',id:p.id};
  }
  else if(a==='addBreaker'){
    const slot=+$('bSlot').value;
    if(!$('bPanel').value){setStat('Add a panel first.');changed=false}
    else if(!slot){setStat('Enter a slot number.');changed=false}
    else{
      const b={id:uid('b'),panel:$('bPanel').value,slot,pole:$('bPole').value,amps:$('bAmps').value.trim(),type:$('bType').value,status:$('bStatus').value,label:$('bLabel').value.trim(),feedsPanel:$('bFeeds').value};
      S.breakers.push(b);sel={kind:'breaker',id:b.id};setStat('');
    }
  }
  if(changed)touch();
  render();
});

document.addEventListener('change',e=>{
  if(e.target.id==='skFile'){
    const f=e.target.files[0];e.target.value='';
    if(f){const img=new Image();img.onload=()=>{sk.img=img;sk.pts=[];skStage('scale')};img.src=URL.createObjectURL(f)}
    return;
  }
  if(e.target.id==='phFile'){const f=e.target.files[0];e.target.value='';if(f)showPhotoGuide(f);return}
  if(e.target.dataset&&e.target.dataset.fl!==undefined){
    const i=+e.target.dataset.fl;S.floors[i]=e.target.value.trim()||S.floors[i];touch();render();return;
  }
  if(e.target.id==='wRooms'){W.wantRooms=e.target.value;showWiz();return}
  if(['pAddr','pShut','pEv','pShow'].includes(e.target.id)){
    if(e.target.id==='pAddr')S.address=e.target.value.trim();
    if(e.target.id==='pShut')S.mainShutoff=e.target.value.trim();
    if(e.target.id==='pEv')S.evCharger=e.target.value.trim();
    if(e.target.id==='pShow')S.showAddress=e.target.checked;
    touch();return;
  }
  if(e.target.id==='fIn'){
    const f=e.target.files[0];if(!f)return;
    f.text().then(txt=>{
      try{S=Object.assign(blank(),JSON.parse(txt));VW=960;VH=640;undoStack=[];lastSnap=null;cur=0;sel=null;currentName=f.name.replace(/\.json$/i,'');dirty=false;setStat('Opened '+f.name);render()}
      catch(err){setStat('That file could not be read as a BreakerBook file.')}
    });
    e.target.value='';return;
  }
  const t=e.target;if(!t.dataset.f||!sel)return;
  const o=find(sel.kind,sel.id);if(!o)return;
  const f=t.dataset.f;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(['w','h','x','y','total','slot','floor'].includes(f))v=+v||0;
  if(f==='w'||f==='h')v=clamp(+v||1,1,200);
  if(f==='floor')v=clamp(v,0,Math.max(0,S.floors.length-1));
  const old=o[f];
  o[f]=v;
  if(sel.kind==='device'&&f==='room')placeDev(o);
  if(sel.kind==='device'&&f==='breaker'&&o.ctrl){const c=S.devices.find(x=>x.id===o.ctrl);if(!c||c.breaker!==o.breaker)o.ctrl=''}
  if(sel.kind==='room'){
    if(f==='floor')S.devices.forEach(d=>{if(d.room===o.id)d.floor=o.floor});
    clampRoom(o);
    if(['w','h','x','y'].includes(f)){
      const before=snapshotLayout();
      const dir=(f==='h'||f==='x')?'x':'y';
      if(!pushHits(o,dir,o)){
        restoreLayout(before);o[f]=old;clampRoom(o);
        setStat('That size would push a neighboring room off the plan.');
      }else setStat('Neighboring rooms were moved to make space.');
    }
  }
  if(sel.kind==='device'&&(f==='x'||f==='y'))clampDev(o);
  if(sel.kind==='panel'){clampPanel(o)}
  if(sel.kind==='room')S.devices.forEach(d=>{if(d.room===o.id&&d.x!=null)clampDev(d)});
  touch();render();
});

const svg=$('svg');
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
svg.addEventListener('pointerdown',e=>{
  if(drawing){const p=pt(e);drawing.push({x:snap(p.x),y:snap(p.y)});drawPlan();return}
  if(e.target.dataset&&e.target.dataset.kind==='vertex'){const o=find('room',e.target.dataset.id);if(o){drag={k:'vertex',o,vi:+e.target.dataset.vi};svg.setPointerCapture(e.pointerId);render();return}}
  const g=e.target.closest('[data-kind]');
  if(!g){sel=null;render();return}
  const k=g.dataset.kind,o=find(k,g.dataset.id),p=pt(e);
  sel={kind:k,id:o.id};drag={k,o,dx:p.x-o.x,dy:p.y-o.y};
  svg.setPointerCapture(e.pointerId);render();
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.k==='vertex'){const p=pt(e),A=shapePts(drag.o);A[drag.vi]={x:snap(p.x),y:snap(p.y)};applyShape(drag.o,A);drawPlan();return}
  const p=pt(e),o=drag.o;
  if(drag.k==='room'){
    // Snap to the 1-foot grid and refuse any position that would overlap another room.
    const tmp={...o,x:snap(p.x-drag.dx),y:snap(p.y-drag.dy)};
    clampRoom(tmp);
    if(!roomsClash(tmp,S.rooms.filter(x=>x.floor===o.floor&&x!==o))){
      const dx=tmp.x-o.x,dy=tmp.y-o.y;o.x=tmp.x;o.y=tmp.y;
      S.devices.forEach(d=>{if(d.room===o.id&&d.x!=null){d.x+=dx;d.y+=dy}});
    }
  }else if(drag.k==='panel'){
    o.x=p.x-drag.dx;o.y=p.y-drag.dy;clampPanel(o);
  }else{
    o.x=p.x-drag.dx;o.y=p.y-drag.dy;clampDev(o);
  }
  drawPlan();
});
const endDrag=()=>{
  if(!drag)return;
  drag=null;touch();render();
};
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

render();
</script></body></html>
