<script>
const DT=['Outlet','Switch','Light','Fan','Fixture','Other'];
const BT=['Standard','GFCI','AFCI','Double-pole'];
// Hues avoid red, which is reserved for unassigned items.
const PALETTE=[210,140,275,180,45,300,95,240,160,120,200,60];
const PX=14;          // one 1-foot grid square = 14 px on the plan
let VW=960,VH=640; // starting plan size (960 px = about 68.5 ft at 14 px per ft)  // plan size in px
const PW=100,PH=44;   // panel object size in px (small box)
const blank=()=>({version:3,updated:'',address:'',showAddress:true,mainShutoff:'',evCharger:'',setupDone:false,floors:[],panels:[],rooms:[],breakers:[],devices:[]});
let S=blank(),cur=0,sel=null,drag=null,noGrid=false,curPanel=null;
const $=id=>document.getElementById(id);
const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(v,hi));
const snap=v=>Math.round(v/PX)*PX;
const find=(k,id)=>({room:S.rooms,device:S.devices,breaker:S.breakers,panel:S.panels}[k]||[]).find(o=>o.id===id);
const bnum=b=>b.slot2?`${b.slot} & ${b.slot2}`:b.slot+(b.pole||'');
const colorOf=id=>{const i=S.breakers.findIndex(b=>b.id===id);return i<0?'#888':`hsl(${PALETTE[i%PALETTE.length]} 60% 42%)`};
const pnum=p=>'P'+(p.num||(S.panels.indexOf(p)+1));
const nextPanelNum=()=>Math.max(0,...S.panels.map(p=>p.num||0))+1;
const panelName=id=>{const p=S.panels.find(x=>x.id===id);return p?pnum(p)+' '+p.name:''};
const avail=p=>Array.from({length:p.total||0},(_,i)=>i+1).filter(n=>!S.breakers.some(b=>b.panel===p.id&&(b.slot===n||b.slot2===n)));
let _statT=null;
const setStat=t=>{const el=$('stat');el.textContent=t;el.classList.toggle('show',!!t);clearTimeout(_statT);if(t)_statT=setTimeout(()=>el.classList.remove('show'),4500)};
let dirty=false,currentName='breakerbook';
const touch=()=>{S.updated=new Date().toLocaleString();dirty=true};

// Rooms: the Width field runs top to bottom, the Length field runs left to right.
const roomBox=r=>r.pts?{x:r.x,y:r.y,w:r.pw,h:r.ph}:{x:r.x,y:r.y,w:r.h*PX,h:r.w*PX};
const overlaps=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const roomsOn=(f,skip)=>S.rooms.filter(r=>r.floor===f&&r!==skip).map(roomBox);
function freeSpot(boxes,w,h){
  for(let y=0;y+h<=VH;y+=PX)for(let x=PX;x+w<=VW;x+=PX){const b={x,y,w,h};if(!boxes.some(o=>overlaps(b,o)))return{x,y}}
  return null;
}
function spotFor(boxes,w,h){let s=freeSpot(boxes,w,h);while(!s){VW+=280;VH+=280;s=freeSpot(boxes,w,h)}return s}
// The plan grows in 20-foot steps (280 px) when anything reaches its edge.
function growCanvas(){
  S.devices.forEach(d=>{if(d.room&&d.x!=null)clampDev(d)});
  let mx=0,my=0;
  S.rooms.forEach(r=>{const b=roomBox(r);mx=Math.max(mx,b.x+b.w);my=Math.max(my,b.y+b.h)});
  S.panels.forEach(p=>{mx=Math.max(mx,p.x+PW);my=Math.max(my,p.y+PH)});
  S.devices.forEach(d=>{if(d.x!=null){mx=Math.max(mx,d.x+60);my=Math.max(my,d.y+14)}});
  VW=960;VH=640;
  while(VW<mx+20)VW+=280;
  while(VH<my+20)VH+=280;
}
function clampRoom(r){const b=roomBox(r);r.x=clamp(snap(r.x),PX,VW-b.w);r.y=clamp(snap(r.y),0,VH-b.h)}
// A device stays inside its room's edges. Room-less devices stay on the plan.
function clampDev(d){
  const r=S.rooms.find(x=>x.id===d.room);
  if(r){const b=roomBox(r);d.x=clamp(Math.round(d.x),b.x+12,b.x+b.w-12);d.y=clamp(Math.round(d.y),b.y+12,b.y+b.h-12)}
  else{d.x=clamp(Math.round(d.x),8,VW-8);d.y=clamp(Math.round(d.y),8,VH-8)}
}
// Panels are small boxes that are not grid-snapped and not treated as rooms.
function clampPanel(p){p.x=clamp(Math.round(p.x),0,VW-PW);p.y=clamp(Math.round(p.y),0,VH-PH)}
function addRoom(name,w,h,floor){
  const r={id:uid('r'),floor,name,w:clamp(+w||10,1,200),h:clamp(+h||10,1,200),x:0,y:0};
  const b=roomBox(r),s=spotFor(roomsOn(floor),b.w,b.h);
  r.x=s.x;r.y=s.y;S.rooms.push(r);return r;
}
// A floor named Garage that has no rooms gets one room called Garage.
function ensureGarageRoom(i){if(/^garage/i.test(S.floors[i]||'')&&!S.rooms.some(r=>r.floor===i))addRoom('Garage',20,22,i)}
function placeDev(d){
  const r=S.rooms.find(x=>x.id===d.room);
  if(!r){d.x=null;d.y=null;return}
  const n=S.devices.filter(x=>x.room===r.id&&x.x!=null&&x.id!==d.id).length;
  d.floor=r.floor;d.x=r.x+30+(n%6)*24;d.y=r.y+60+Math.floor(n/6)*24;clampDev(d);
}
function delSel(){
  if(!sel)return;const {kind,id}=sel;
  if(kind==='room'){S.rooms=S.rooms.filter(r=>r.id!==id);S.panels.forEach(p=>{if(p.room===id){p.room='';p.x=null;p.y=null}});S.devices.forEach(d=>{if(d.room===id){d.room='';d.x=null;d.y=null}})}
  else if(kind==='device'){S.devices=S.devices.filter(d=>d.id!==id);S.devices.forEach(d=>{if(d.ctrl===id)d.ctrl=''})}
  else if(kind==='breaker'){S.breakers=S.breakers.filter(b=>b.id!==id);S.devices.forEach(d=>{if(d.breaker===id)d.breaker=''})}
  else if(kind==='panel'){
    const gone=S.breakers.filter(b=>b.panel===id).map(b=>b.id);
    S.panels=S.panels.filter(p=>p.id!==id);
    S.breakers=S.breakers.filter(b=>b.panel!==id);
    S.devices.forEach(d=>{if(gone.includes(d.breaker))d.breaker=''});
    S.breakers.forEach(b=>{if(b.feedsPanel===id)b.feedsPanel=''});
  }
  sel=null;
}

// Standard US symbols, drawn centered on (0,0).
function symbol(t){
  const st='fill:none;stroke:var(--fg);stroke-width:1.5';
  if(t==='Outlet')return `<circle r="6" style="${st}"/><line x1="-3.5" y1="-1.6" x2="3.5" y2="-1.6" style="${st}"/><line x1="-3.5" y1="1.6" x2="3.5" y2="1.6" style="${st}"/>`;
  if(t==='Switch')return `<text y="4" font-size="11" font-weight="bold" text-anchor="middle" style="fill:var(--fg)">S</text>`;
  if(t==='Light'||t==='Fixture')return `<circle r="6" style="${st}"/><line x1="-4" y1="-4" x2="4" y2="4" style="${st}"/><line x1="-4" y1="4" x2="4" y2="-4" style="${st}"/>`;
  if(t==='Fan')return `<circle r="6" style="${st}"/><text y="3.5" font-size="9" text-anchor="middle" style="fill:var(--fg)">F</text>`;
  return `<rect x="-5" y="-5" width="10" height="10" style="${st}"/>`;
}

// Panel label for devices fed from panel P2 or higher; P1 devices are not labeled.
function dpl(d){const b=S.breakers.find(x=>x.id===d.breaker),p=b&&S.panels.find(x=>x.id===b.panel);return p&&pnum(p)!=='P1'?' · '+pnum(p):''}
function drawPlan(){
  let h='';
  if(!S.floors.length){
    h='<text x="20" y="40" font-size="14" style="fill:var(--fg)">Add a floor to start, using the Floors section on the right.</text>';
  }else{
    for(const r of S.rooms.filter(r=>r.floor===cur)){
      const s=sel?.kind==='room'&&sel.id===r.id,b=roomBox(r);
      h+=`<g data-kind="room" data-id="${r.id}" style="cursor:move">${r.pts?`<polygon points="${r.pts.map(p=>(r.x+p.x)+','+(r.y+p.y)).join(' ')}" style="fill:${s?'var(--rfs)':'var(--rf)'};stroke:${s?'var(--ac)':'var(--wall)'};stroke-width:${s?3:2};stroke-linejoin:round"/>`:`<rect x="${r.x}" y="${r.y}" width="${b.w}" height="${b.h}" rx="4" style="fill:${s?'var(--rfs)':'var(--rf)'};stroke:${s?'var(--ac)':'var(--wall)'};stroke-width:${s?3:2};stroke-linejoin:round"/>`}${(()=>{let L=r.name;const mc=Math.max(1,Math.floor((b.w-14)/7));if(L.length>mc)L=L.slice(0,Math.max(1,mc-1))+'…';const tw=L.length*7+14,cx=r.x+b.w/2,cy=r.y+b.h*2/3;return `<rect x="${cx-tw/2}" y="${cy-13}" width="${tw}" height="19" rx="4" style="fill:var(--pn);stroke:var(--ln)"/><text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="13" style="fill:var(--fg)">${esc(L)}</text>`})()}</g>`;
    }
    for(const r of S.rooms.filter(r=>r.floor===cur&&r.pts&&sel?.kind==='room'&&sel.id===r.id))h+=r.pts.map((p,i)=>`<circle data-kind="vertex" data-id="${r.id}" data-vi="${i}" cx="${r.x+p.x}" cy="${r.y+p.y}" r="22" style="fill:transparent;cursor:move"/><circle data-kind="vertex" data-id="${r.id}" data-vi="${i}" cx="${r.x+p.x}" cy="${r.y+p.y}" r="9" style="fill:var(--ac);stroke:#fff;pointer-events:none"/>`).join('');
    // Dotted arcs: each device to the device it is controlled from (switch to first light, then light to light).
    for(const d of S.devices){
      const c=d.ctrl&&S.devices.find(x=>x.id===d.ctrl);
      if(!c||c.x==null||d.x==null||c.floor!==cur||d.floor!==cur)continue;
      const mx=(c.x+d.x)/2,my=(c.y+d.y)/2,dx=d.x-c.x,dy=d.y-c.y,len=Math.hypot(dx,dy)||1,off=len*0.25;
      h+=`<path d="M${c.x} ${c.y} Q${mx-dy/len*off} ${my+dx/len*off} ${d.x} ${d.y}" style="fill:none;stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 4"/>`;
    }
    for(const p of S.panels.filter(p=>p.floor===cur&&p.x!=null)){const s=sel?.kind==='panel'&&sel.id===p.id;h+=`<g data-kind="panel" data-id="${p.id}" style="cursor:move"><rect x="${p.x-12}" y="${p.y-12}" width="24" height="24" rx="5" style="fill:var(--pn);stroke:${s?'var(--ac)':'var(--fg)'};stroke-width:${s?3:1.5}"/><path d="M${p.x+2} ${p.y-8} L${p.x-4} ${p.y+1} L${p.x} ${p.y+1} L${p.x-2} ${p.y+8} L${p.x+4} ${p.y-1} L${p.x} ${p.y-1} Z" style="fill:#e0a800"/><text x="${p.x+18}" y="${p.y+4}" font-size="12" font-weight="bold" style="fill:var(--fg)">${pnum(p)} ${esc(p.name)}</text></g>`}
    for(const d of S.devices){
      if(d.x==null||d.floor!==cur)continue;
      const s=sel?.kind==='device'&&sel.id===d.id;
      const b=S.breakers.find(x=>x.id===d.breaker);
      const ring=s?`<circle cx="${d.x}" cy="${d.y}" r="15" style="fill:none;stroke:var(--ac);stroke-width:2"/>`:'';
      const mark=b
        ?`<circle cx="${d.x}" cy="${d.y}" r="12" style="fill:${colorOf(b.id)}"/><text x="${d.x}" y="${d.y+3.5}" font-size="9" font-weight="bold" text-anchor="middle" style="fill:#fff">${esc(bnum(b))}</text>`
        :`<circle cx="${d.x}" cy="${d.y}" r="12" style="fill:#d33"/><text x="${d.x}" y="${d.y+5}" font-size="13" font-weight="bold" text-anchor="middle" style="fill:#fff">?</text>`;
      h+=`<g data-kind="device" data-id="${d.id}" style="cursor:move">${ring}${mark}<g transform="translate(${d.x+26},${d.y})">${symbol(d.type)}</g><text x="${d.x+38}" y="${d.y+4}" font-size="11" style="fill:var(--fg)">${esc(d.name)}${d.gfci?' · GFCI':''}${dpl(d)}</text></g>`;
    }
    if(!S.rooms.some(r=>r.floor===cur))h+='<text x="20" y="40" font-size="14" style="fill:var(--fg)">No rooms on this floor yet. Add one on the right.</text>';
  }
  if(drawing)h+=drawingSVG();
  if(!noGrid)h=`<defs><pattern id="gd" width="${PX}" height="${PX}" patternUnits="userSpaceOnUse"><circle cx="${PX/2}" cy="${PX/2}" r=".9" style="fill:var(--ln)"/></pattern></defs><rect x="0" y="0" width="${VW}" height="${VH}" fill="url(#gd)" style="pointer-events:none"/>`+h;
  $('svg').setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  $('svg').innerHTML=h;
}
function renderTabs(){

  if(sel.kind==='breaker')b=f('label','Name / label',o.label)+s('panel','Panel',S.panels.map(p=>[p.id,p.name]),o.panel)+f('slot','Slot',o.slot,'number')+s('pole','Pole',[['','Single'],['A','A (tandem)'],['B','B (tandem)']],o.pole)+f('amps','Amps',o.amps)+s('type','Type',BT.map(t=>[t,t]),o.type)+s('status','Status',[['used','Used'],['unused','Unused']],o.status)+s('feedsPanel','Feeds subpanel',[['','(none)'],...S.panels.filter(p=>p.id!==o.panel).map(p=>[p.id,p.name])],o.feedsPanel);
  if(sel.kind==='panel')b=f('name','Name',o.name)+s('floor','Floor',S.floors.map((n,i)=>[i,n]),o.floor)+s('room','Room',[['','(none)'],...S.rooms.filter(q=>q.floor===o.floor).map(q=>[q.id,q.name])],o.room)+f('total','Total slots',o.total,'number');
  return b+`<div class="row" style="margin-top:8px"><button class="danger" data-act="del">Delete ${sel.kind}</button></div>`;

function floorMarkup(f){const keep=cur,ks=sel;cur=f;sel=null;noGrid=true;drawPlan();const m=$('svg').innerHTML;noGrid=false;cur=keep;sel=ks;drawPlan();return m}
// Crop the drawing to the floor's content so symbols and text print at a readable size.
function floorBox(f){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(x,y,w,h)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+w);y1=Math.max(y1,y+h)};
  S.rooms.filter(r=>r.floor===f).forEach(r=>{const b=roomBox(r);add(b.x,b.y,b.w,b.h)});
  S.panels.filter(p=>p.floor===f).forEach(p=>add(p.x,p.y,PW,PH));
  S.devices.filter(d=>d.floor===f&&d.x!=null).forEach(d=>add(d.x-14,d.y-14,170,28));
  if(x0>=1e9)return [0,0,VW,VH];
  return [x0-20,y0-20,x1-x0+40,y1-y0+40];
}
// QR code linking to the app's web address (not to any home record).
function appQR(){

  if(!url||typeof qrcode==='undefined')return '<div class="qr"><p>Open BreakerBook at its web address to create the QR code.</p></div>';
  const q=qrcode(0,'M');q.addData(url);q.make();
  return `<div class="qr">${q.createSvgTag({cellSize:3,margin:1})}<p>BreakerBook: scan to open the app<br>${esc(url)}</p></div>`;
}

    lines.forEach(l=>{x0=Math.min(x0,l.x);y0=Math.min(y0,l.y);x1=Math.max(x1,l.x+l.w);y1=Math.max(y1,l.y+l.h)});

    if(!words.length)return;
    const per=words.length===rd.lines.length?words:rd.lines.length===1?[words.join(' ')]:null;
    if(!per)return;
    const bank=inkBank();let learned=false;
    per.forEach((word,k)=>{

async function skDetect(){
  const ft=+$('skFt').value;
  if(sk.pts.length<2){skMsg('Tap two points on a wall first.');return}
  if(!ft){skMsg('Enter the wall length in feet.');return}
  const px=Math.hypot(sk.pts[0].x-sk.pts[1].x,sk.pts[0].y-sk.pts[1].y);
  sk.k=ft/px;
  skMsg('Finding rooms…');
  try{
    const Wk=Math.min(700,sk.img.width),Hk=Math.round(sk.img.height*Wk/sk.img.width);
    const c=document.createElement('canvas');c.width=Wk;c.height=Hk;
    const ctx=c.getContext('2d');ctx.drawImage(sk.img,0,0,Wk,Hk);
    const d=ctx.getImageData(0,0,Wk,Hk).data;
    const gray=new Uint8Array(Wk*Hk);
    for(let i=0;i<Wk*Hk;i++)gray[i]=(d[i*4]*0.3+d[i*4+1]*0.59+d[i*4+2]*0.11)|0;
    const found=findRoomsMerged(gray,Wk,Hk,sk.img.width/Wk);
    let reads=[];
    try{reads=readRoomNames(gray,Wk,Hk,found,sk.img.width/Wk)}catch(err){reads=[]}
    sk.cands=found.map((r,i)=>{const rd=reads[i]||null;return {...r,wf:clamp(Math.round(r.w*sk.k),1,200),hf:clamp(Math.round(r.h*sk.k),1,200),read:rd,W:Wk,pre:rd&&rd.sure?rd.guess:''}});

  }catch(err){skMsg('Could not finish: '+((err&&err.message)||err)+'. Try a clearer photo.')}
}
function skAdd(){
  const s=sk.k*PX;let added=0,skipped=0;

  const polys=chosen.map(({c})=>c.poly?c.poly.map(p=>({x:40+p.x*s,y:40+p.y*s})):[{x:40+c.x*s,y:40+c.y*s},{x:40+(c.x+c.w)*s,y:40+c.y*s},{x:40+(c.x+c.w)*s,y:40+(c.y+c.h)*s},{x:40+c.x*s,y:40+(c.y+c.h)*s}]);

  const aligned=alignPolys(polys,2.5*PX,PX);
  const OFFS=[[0,0],[0,1],[0,-1],[1,0],[-1,0],[0,2],[0,-2],[2,0],[-2,0]];
  chosen.forEach(({c,i},j)=>{
    const Q=aligned[j];
    const typed=(document.querySelector(`[data-nm="${i}"]`)?.value||'').trim();
    const name=typed||`Room ${i+1}`;
    if(typed)learnFromCandidate(c,typed);
    const mx=Math.min(...Q.map(p=>p.x)),my=Math.min(...Q.map(p=>p.y));

    const r={id:uid('r'),floor:cur,name,x:mx,y:my,w:Math.max(1,Math.round(ph/PX)),h:Math.max(1,Math.round(pw/PX))};

    const others=S.rooms.filter(x=>x.floor===cur);

function drawingSVG(){
  if(!drawing||!drawing.length)return'';
  return `<polyline points="${drawing.map(p=>p.x+','+p.y).join(' ')}" style="fill:none;stroke:var(--ac);stroke-width:2;stroke-dasharray:5 4"/>`+drawing.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" style="fill:var(--ac)"/>`).join('');
}
function finishDraw(){
  if(!drawing||drawing.length<3){setStat('Tap at least 3 corners.');return}
  if(polySelf(drawing)){setStat('The corners cross each other. Undo the last corner and try again.');return}
  const r={id:uid('r'),floor:cur,name:($('rName')?.value||'').trim()||'Room',w:1,h:1,x:0,y:0};
  normalizePoly(r,drawing);
  if(roomsClash(r,S.rooms.filter(x=>x.floor===cur))){setStat('That shape overlaps another room.');return}
  S.rooms.push(r);drawing=null;setStat(`Added ${r.name}.`);
}
function vAdd(id){
  const r=S.rooms.find(x=>x.id===id);if(!r)return;
  const A=shapePts(r),n=A.length;
  applyShape(r,[...A,{x:snap((A[n-1].x+A[0].x)/2),y:snap((A[n-1].y+A[0].y)/2)}]);
}
function vDel(id){
  const r=S.rooms.find(x=>x.id===id);if(!r)return;
  const A=shapePts(r);
  if(A.length<=3){setStat('A room needs at least 3 corners.');return}
  applyShape(r,A.slice(0,-1));
}

// Undo: every change to the data is recorded when the screen redraws (the saved timestamp is ignored).
let undoStack=[],lastSnap=null;
const snapKey=()=>{const {updated,...rest}=S;return JSON.stringify(rest)};
function newFile(){S=blank();VW=960;VH=640;undoStack=[];lastSnap=null;cur=0;sel=null;bform=null;dirty=false;currentName='breakerbook';setStat('New file. Save to keep it.');render()}
function maybeSetup(){if(!S.setupDone&&!S.floors.length&&!$('sdlg').classList.contains('open'))openWiz()}
function render(){
  try{localStorage.setItem('breakerbook-draft',JSON.stringify(S))}catch(e){}
  S.devices.forEach(d=>{if(d.ctrl){const c=S.devices.find(x=>x.id===d.ctrl);if(!c||!d.breaker||c.breaker!==d.breaker)d.ctrl=''}});
  const key=snapKey();
  if(lastSnap!==null&&key!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>50)undoStack.shift()}
  lastSnap=key;
  if(cur>=S.floors.length)cur=0;document.body.classList.toggle('bmode',mode==='brk');growCanvas();drawPlan();renderTabs();renderSide();renderBrk();maybeSetup()}

document.addEventListener('click',e=>{

  if(e.target.id==='phc'){phTap(e);return}

  let changed=true;

  else if(a==='open')$('fIn').click();
  else if(a==='new'){if(dirty)$('ndlg').classList.add('open');else newFile();changed=false}
  else if(a==='newYes'){$('ndlg').classList.remove('open');newFile();changed=false}
  else if(a==='newCancel'){$('ndlg').classList.remove('open');changed=false}
  else if(a==='combine'){
    const p=S.panels.find(x=>x.id===t.dataset.panel),n=+t.dataset.slot;
    const top=S.breakers.find(b=>b.panel===p.id&&b.slot===n&&!b.pole&&!b.slot2);
    if(top)top.slot2=n+2;
    else bform={panel:p.id,slot:n,slot2:n+2,pole:'',id:null};
  }
  else if(a==='split'){const b=S.breakers.find(x=>x.id===id);if(b)delete b.slot2;bform=null}
  else if(a==='save'){
    const nm=prompt('Save file as',currentName);
    if(!nm){changed=false;render();return}
    currentName=nm.trim().replace(/[\/:*?"<>|]+/g,'-')||'breakerbook';
    touch();
    const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    const x=document.createElement('a');x.href=url;x.download=currentName+'.json';dirty=false;x.click();
    setStat('Saved '+currentName+'.json');changed=false;
  }
  else if(a==='printOpts'){
    $('pAddr').value=S.address;$('pShow').checked=S.showAddress;$('pShut').value=S.mainShutoff;$('pEv').value=S.evCharger;
    $('pdlg').classList.add('open');changed=false;
  }
  else if(a==='closePrint'){$('pdlg').classList.remove('open');changed=false}
  else if(a==='print'){$('pdlg').classList.remove('open');changed=false;buildPrint()}
  else if(a==='view'){document.body.classList.toggle('bmode',t.dataset.v==='brk');changed=false}
  else if(a==='bnew'){bform={panel:t.dataset.panel,slot:+t.dataset.slot,pole:t.dataset.pole,id:null};changed=false}
  else if(a==='bedit'){const b=S.breakers.find(x=>x.id===id);if(b)bform={panel:b.panel,slot:b.slot,pole:b.pole||'',id:b.id};changed=false}
  else if(a==='bfCancel'){bform=null;changed=false}
  else if(a==='bfSave'){
    const amps=$('bfAmps').value.trim().replace(/a$/i,'');
    const vals={label:$('bfLabel').value.trim(),amps,type:$('bfType').value,status:$('bfStatus').value,feedsPanel:$('bfFeeds').value};
    if(bform.id)Object.assign(S.breakers.find(x=>x.id===bform.id),vals);
    else if(!S.floors.length)alert('Create your floors first, in the Floors mode.');
    else S.breakers.push({id:uid('b'),panel:bform.panel,slot:bform.slot,slot2:bform.slot2,pole:bform.pole,...vals});
    bform=null;
  }
  else if(a==='bfDel'){
    const id0=bform.id,dv=S.devices.filter(d=>d.breaker===id0).length;
    const doit=()=>{S.breakers=S.breakers.filter(x=>x.id!==id0);S.devices.forEach(d=>{if(d.breaker===id0)d.breaker=''});bform=null;touch();render()};
    if(dv){askConfirm(`Delete this breaker? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} breaker assignment.`,doit);changed=false}
    else{doit();changed=false}

      const p={id:uid('p'),num:nextPanelNum(),name:n,location:'',total:+$('bpTot').value||0,floor:cur,room:'',x:null,y:null};
      S.panels.push(p);curPanel=p.id;
    }

    if(g==='att')names.push('Garage');
    if(g==='det')names.push('Garage (detached)');

    return;
  }

  else if(a==='wizRooms'){wizSaveRooms();wizToPanels();return}

    cur=+t.dataset.i;W.inSk=true;$('sdlg').classList.remove('open');

  }
  else if(a==='wizPhoto'){W.inPh=true;$('sdlg').classList.remove('open');openPhoto(W.panelIds[+t.dataset.i],true);return}
  else if(a==='wizManual'){W.mIdx=+t.dataset.i;showWiz('bmanual');return}
  else if(a==='wizManualSave'){
    const p=S.panels.find(x=>x.id===W.panelIds[W.mIdx]);
    if(p){

      parseBrk($('wbm').value).forEach(b=>{
        if(b.slot>p.total||S.breakers.some(x=>x.panel===p.id&&(x.slot===b.slot||x.slot2===b.slot)))return;
        if(b.pole){p.tandem=p.tandem||{};p.tandem[b.slot]=true}
        S.breakers.push({id:uid('b'),panel:p.id,slot:b.slot,pole:b.pole,amps:b.amps,type:'Standard',status:'used',label:b.funcs,funcs:b.funcs,feedsPanel:''});
      });
      touch();render();
    }
    showWiz('bchoice');return;
  }
  else if(a==='wizFinish'){finishWiz();return}
  else if(a==='tandem'){
    const p=S.panels.find(x=>x.id===t.dataset.panel),n=+t.dataset.slot;
    p.tandem=p.tandem||{};
    if(p.tandem[n]){
      if(S.breakers.some(b=>b.panel===p.id&&b.slot===n&&b.pole==='B')){setStat('Remove the B breaker before making this slot single.');changed=false}
      else{p.tandem[n]=false;S.breakers.forEach(b=>{if(b.panel===p.id&&b.slot===n&&b.pole==='A')b.pole=''})}
    }else{
      p.tandem[n]=true;S.breakers.forEach(b=>{if(b.panel===p.id&&b.slot===n&&!b.pole)b.pole='A'});
    }
    bform=null;
  }
  else if(a==='drawStart'){drawing=[];setStat('Tap the corners on the plan, in order.');changed=false}
  else if(a==='drawUndo'){if(drawing)drawing.pop();changed=false}
  else if(a==='drawCancel'){drawing=null;changed=false}
  else if(a==='drawFinish'){finishDraw()}
  else if(a==='vAdd'){vAdd(id)}
  else if(a==='vDel'){vDel(id)}
  else if(a==='sketch'){sk={mode:'pick',img:null,pts:[],k:0,cands:[]};$('phdlg').classList.add('open');skStage('pick');changed=false}
  else if(a==='skChoose'){$('skFile').click();changed=false}
  else if(a==='skDetect'){skDetect();changed=false}
  else if(a==='skAdd'){skAdd()}
  else if(a==='photo'){openPhoto();changed=false}
  else if(a==='phType'){
    if($('phPanel'))phCtx.panel=S.panels.find(x=>x.id===$('phPanel').value)||null;
    phCtx.kind=t.dataset.v;if(phCtx.panel)$('phFile').click();changed=false;
  }
  else if(a==='phCancel'){$('phdlg').classList.remove('open');wizReturn();phReturn();changed=false}
  else if(a==='phReset'||a==='phBackCorners'){phCtx.pts=[];phStage('corners');changed=false}
  else if(a==='phRead'){phCtx.cols=+($('phCols')?.value||2);phProcess();changed=false}
  else if(a==='phAmp'){const el=document.querySelector(`[data-pa="${t.dataset.i}"]`);if(el)el.value=t.dataset.v;changed=false}
  else if(a==='phSame'){const i=+t.dataset.i,a0=document.querySelector(`[data-pl="${i-1}"]`),el=document.querySelector(`[data-pl="${i}"]`);if(el&&a0)el.value=a0.value;changed=false}
  else if(a==='phLab'){const el=document.querySelector(`[data-pl="${t.dataset.i}"]`);if(el)el.value=t.dataset.v;changed=false}
  else if(a==='phApply'){applyGuide()}
  else if(a==='phConfirm'){
    let upd=0;
    document.querySelectorAll('[data-cf]').forEach(sel=>{

  }
  else if(a==='pickPanel'){curPanel=id;bform=null;changed=false}
  else if(a==='skPick'){const el=document.querySelector(`[data-nm="${t.dataset.i}"]`);if(el)el.value=t.dataset.v;changed=false}
  else if(a==='undo'){
    if(undoStack.length){S=JSON.parse(undoStack.pop());lastSnap=snapKey();sel=null;bform=null;setStat('Undone.')}
    else setStat('Nothing to undo.');

  else if(a==='mode'){mode=t.dataset.m;sel=null;changed=false}
  else if(a==='floorDel'){

      const pIds=S.panels.filter(p=>p.floor===i).map(p=>p.id);
      const bIds=S.breakers.filter(b=>pIds.includes(b.panel)).map(b=>b.id);

      S.breakers=S.breakers.filter(b=>!bIds.includes(b.id));
      S.breakers.forEach(b=>{if(pIds.includes(b.feedsPanel))b.feedsPanel=''});
      S.panels=S.panels.filter(p=>p.floor!==i);
      S.rooms=S.rooms.filter(r=>r.floor!==i);
      const shift=f=>f>i?f-1:f;
      S.rooms.forEach(r=>{r.floor=shift(r.floor)});
      S.devices.forEach(d=>{d.floor=shift(d.floor)});
      S.panels.forEach(p=>{p.floor=shift(p.floor)});

  else if(a==='cYes'){const f=pendingYes;pendingYes=null;$('cdlg').classList.remove('open');if(f)f();changed=false}

      const nb=S.breakers.filter(b=>b.panel===sel.id),ids=nb.map(b=>b.id),dv=S.devices.filter(d=>ids.includes(d.breaker)).length;

      askConfirm(`Delete this panel and its ${nb.length} breaker${nb.length===1?'':'s'}? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} breaker assignment.`,()=>{delSel();bform=null;touch();render()});

    }else if(sel?.kind==='room'){
      const rid=sel.id,rn=(S.rooms.find(r=>r.id===rid)||{}).name||'this room';

      const doit=()=>{delSel();bform=null;touch();render()};
      askConfirm(dv
        ?`Delete ${rn}? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} room and move to Needs assignment.`

    }else if(sel?.kind==='breaker'){
      const bid=sel.id,dv=S.devices.filter(d=>d.breaker===bid).length;
      const doit=()=>{delSel();bform=null;touch();render()};
      if(dv){askConfirm(`Delete this breaker? ${dv} item${dv===1?'':'s'} will lose ${dv===1?'its':'their'} breaker assignment.`,doit);changed=false}
      else doit();
    }else delSel();
  }
  else if(a==='fit'){
    const placed=[];
    S.rooms.filter(r=>r.floor===cur).forEach(r=>{const b=roomBox(r),s=spotFor(placed,b.w,b.h);r.x=s.x;r.y=s.y;placed.push(roomBox(r))});
    S.devices.forEach(d=>{if(d.room&&d.x!=null)clampDev(d)});
  }
  else if(a==='addFloor'){const n=$('fName').value.trim();if(n){S.floors.push(n);cur=S.floors.length-1;ensureGarageRoom(cur)}else changed=false}
  else if(a==='addRoom'){
    if(!S.floors.length){setStat('Add a floor first.');changed=false}
    else{const r=addRoom($('rName').value.trim()||'Room',$('rW').value,$('rH').value,cur);sel={kind:'room',id:r.id}}
  }
  else if(a==='addDevice'){
    const type=$('dType').value;
    const d={id:uid('d'),name:$('dName').value.trim()||type,type,room:$('dRoom').value,breaker:$('dBrk').value,gfci:$('dGfci').checked,ctrl:'',floor:cur,x:null,y:null};
    S.devices.push(d);placeDev(d);sel={kind:'device',id:d.id};
  }
  else if(a==='addPanel'){
    const n=S.panels.filter(q=>q.floor===cur).length;
    const p={id:uid('p'),num:nextPanelNum(),name:$('pName').value.trim()||'Panel',total:+$('pTot').value||0,floor:$('pFloor')?+$('pFloor').value:cur,room:$('pRoom')?.value||'',x:null,y:null};
    S.panels.push(p);placeDev(p);sel={kind:'panel',id:p.id};curPanel=p.id;
  }
  else if(a==='addBreaker'){
    const slot=+$('bSlot').value;
    if(!$('bPanel').value){setStat('Add a panel first.');changed=false}
    else if(!slot){setStat('Enter a slot number.');changed=false}
    else{
      const b={id:uid('b'),panel:$('bPanel').value,slot,pole:$('bPole').value,amps:$('bAmps').value.trim(),type:$('bType').value,status:$('bStatus').value,label:$('bLabel').value.trim(),feedsPanel:$('bFeeds').value};
      S.breakers.push(b);sel={kind:'breaker',id:b.id};setStat('');
    }
  }
  if(changed)touch();
  render();
});

document.addEventListener('change',e=>{
  if(e.target.id==='pFloor'){$('pRoom').innerHTML=panelRoomOpts(+e.target.value);return}

  if(e.target.id==='skFile'){
    const f=e.target.files[0];e.target.value='';
    if(f){const img=new Image();img.onload=()=>{sk.img=img;sk.pts=[];skStage('scale')};img.src=URL.createObjectURL(f)}
    return;
  }
  if(e.target.id==='phFile'){const f=e.target.files[0];e.target.value='';if(f)phLoad(f);return}
  if(e.target.id==='phCols'){phCtx.cols=+e.target.value;return}
  if(e.target.id==='phSlots'){phCtx.slots=clamp(+e.target.value||24,2,84);phBuildRows();phStage('rows');return}
  if(e.target.id==='phNum'){phCtx.numbering=e.target.value;phBuildRows();phStage('rows');return}
  if(e.target.dataset&&e.target.dataset.pf!==undefined){const rows=readPanelRows();rows[+e.target.dataset.pf].room='';W.panelRows=rows;showWiz();return}
  if(e.target.dataset&&e.target.dataset.fl!==undefined){
    const i=+e.target.dataset.fl;S.floors[i]=e.target.value.trim()||S.floors[i];touch();render();return;
  }
  if(['pAddr','pShut','pEv','pShow'].includes(e.target.id)){
    if(e.target.id==='pAddr')S.address=e.target.value.trim();
    if(e.target.id==='pShut')S.mainShutoff=e.target.value.trim();
    if(e.target.id==='pEv')S.evCharger=e.target.value.trim();
    if(e.target.id==='pShow')S.showAddress=e.target.checked;
    touch();return;
  }
  if(e.target.id==='fIn'){
    const f=e.target.files[0];if(!f)return;
    f.text().then(txt=>{
      try{S=Object.assign(blank(),JSON.parse(txt));VW=960;VH=640;undoStack=[];lastSnap=null;cur=0;sel=null;currentName=f.name.replace(/\.json$/i,'');dirty=false;setStat('Opened '+f.name);render()}
      catch(err){setStat('That file could not be read as a BreakerBook file.')}
    });
    e.target.value='';return;
  }
  const t=e.target;if(!t.dataset.f||!sel)return;
  const o=find(sel.kind,sel.id);if(!o)return;
  const f=t.dataset.f;
  let v=t.type==='checkbox'?t.checked:t.value;
  if(['w','h','x','y','total','slot','floor'].includes(f))v=+v||0;
  if(f==='w'||f==='h')v=clamp(+v||1,1,200);
  if(f==='floor')v=clamp(v,0,Math.max(0,S.floors.length-1));
  const old=o[f];
  o[f]=v;
  if(sel.kind==='device'&&f==='room')placeDev(o);
  if(sel.kind==='device'&&f==='breaker'&&o.ctrl){const c=S.devices.find(x=>x.id===o.ctrl);if(!c||c.breaker!==o.breaker)o.ctrl=''}
  if(sel.kind==='room'){
    if(f==='floor')S.devices.forEach(d=>{if(d.room===o.id)d.floor=o.floor});
    clampRoom(o);
    if(['w','h','x','y'].includes(f)){
      const before=snapshotLayout();
      const dir=(f==='h'||f==='x')?'x':'y';
      if(!pushHits(o,dir,o)){
        restoreLayout(before);o[f]=old;clampRoom(o);
        setStat('That size would push a neighboring room off the plan.');
      }else setStat('Neighboring rooms were moved to make space.');
    }
  }
  if(sel.kind==='device'&&(f==='x'||f==='y'))clampDev(o);
  if(sel.kind==='panel'){if(f==='room')placeDev(o);if(f==='floor'){o.room='';o.x=null;o.y=null}}
  if(sel.kind==='room')S.devices.forEach(d=>{if(d.room===o.id&&d.x!=null)clampDev(d)});
  touch();render();
});

const svg=$('svg');
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
svg.addEventListener('pointerdown',e=>{
  if(drawing){const p=pt(e);drawing.push({x:snap(p.x),y:snap(p.y)});drawPlan();return}
  if(e.target.dataset&&e.target.dataset.kind==='vertex'){const o=find('room',e.target.dataset.id);if(o){drag={k:'vertex',o,vi:+e.target.dataset.vi};svg.setPointerCapture(e.pointerId);render();return}}
  const g=e.target.closest('[data-kind]');
  if(!g){sel=null;render();return}
  const k=g.dataset.kind,o=find(k,g.dataset.id),p=pt(e);
  sel={kind:k,id:o.id};drag={k,o,dx:p.x-o.x,dy:p.y-o.y};
  svg.setPointerCapture(e.pointerId);render();
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(drag.k==='vertex'){const p=pt(e),A=shapePts(drag.o);A[drag.vi]={x:snap(p.x),y:snap(p.y)};applyShape(drag.o,A);drawPlan();return}
  const p=pt(e),o=drag.o;
  if(drag.k==='room'){
    // Snap to the 1-foot grid and refuse any position that would overlap another room.
    const tmp={...o,x:snap(p.x-drag.dx),y:snap(p.y-drag.dy)};
    clampRoom(tmp);
    if(!roomsClash(tmp,S.rooms.filter(x=>x.floor===o.floor&&x!==o))){
      const dx=tmp.x-o.x,dy=tmp.y-o.y;o.x=tmp.x;o.y=tmp.y;
      S.devices.forEach(d=>{if(d.room===o.id&&d.x!=null){d.x+=dx;d.y+=dy}});
    }
  }else if(drag.k==='panel'){
    o.x=p.x-drag.dx;o.y=p.y-drag.dy;clampDev(o);
  }else{
    o.x=p.x-drag.dx;o.y=p.y-drag.dy;clampDev(o);
  }
  drawPlan();
});
const endDrag=()=>{
  if(!drag)return;
  drag=null;touch();render();
};
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

try{const d=localStorage.getItem('breakerbook-draft');if(d){S=Object.assign(blank(),JSON.parse(d));dirty=true;setStat('Restored unsaved work.')}}catch(e){}
$('brkWords').innerHTML=BRK_WORDS.map(n=>`<option value="${titleCase(n)}">`).join('');
$('roomNames').innerHTML=ROOM_NAME_LIST.map(n=>`<option value="${n}">`).join('');
render();
(function(){
  const sp=$('splash');
  const go=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),600)};
  sp.addEventListener('pointerdown',go);
  document.addEventListener('keydown',()=>{if(document.body.contains(sp))go()});
})();
</script></body></html>
